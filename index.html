<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Hangman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main class="game-shell">
      <p class="game-label">Vue.js Projekt</p>
      <h1 class="game-title">Retro Hangman</h1>
      <p class="game-subtitle">{{ message }}</p>

      <section class="game-container">
        <section class="game-panel">
          <p class="panel-title">Spielfeld</p>
          <p class="word-preview">{{ displayWord }}</p>
          <button class="pixel-button" type="button" @click="selectRandomWord">
            Neues Testwort
          </button>
          <p class="selected-word-test">Testwort: {{ selectedWord }}</p>
        </section>

        <div class="capybara-container">
          <svg class="capybara" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
            <!-- Körper -->
            <ellipse cx="50" cy="35" rx="35" ry="18" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Kopf -->
            <circle cx="28" cy="25" r="14" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Schnauze -->
            <ellipse cx="18" cy="27" rx="8" ry="6" fill="#A0826D" stroke="#000" stroke-width="1.5"/>
            <!-- Nase -->
            <circle cx="14" cy="26" r="2" fill="#000"/>
            <!-- Linkes Auge -->
            <circle cx="24" cy="20" r="2.5" fill="#000"/>
            <!-- Rechtes Auge -->
            <circle cx="32" cy="19" r="2.5" fill="#000"/>
            <!-- Linkes Ohr -->
            <circle cx="23" cy="12" r="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Rechtes Ohr -->
            <circle cx="34" cy="11" r="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Vordere linke Pfote -->
            <rect x="35" y="48" width="6" height="10" rx="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Vordere rechte Pfote -->
            <rect x="48" y="48" width="6" height="10" rx="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Hintere linke Pfote -->
            <rect x="62" y="48" width="6" height="10" rx="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
            <!-- Hintere rechte Pfote -->
            <rect x="75" y="48" width="6" height="10" rx="3" fill="#8B7355" stroke="#000" stroke-width="1.5"/>
          </svg>
        </div>
      </section>

      <p class="hint-text">
        Vue ist aktiv und das Grundgerüst funktioniert.
      </p>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="words.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
