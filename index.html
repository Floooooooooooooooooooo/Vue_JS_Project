<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Standman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main class="game-shell">
      <p class="game-label">Vue.js Projekt</p>
      <h1 class="game-title">Retro Standman</h1>

      <section class="game-board">
        <div class="hangman-stage" aria-label="Platz fuer das Hangman Strichmaennchen">
          <div class="gallows-preview" aria-hidden="true">
            <span class="gallows-base"></span>
            <span class="gallows-pole"></span>
            <span class="gallows-top"></span>
            <span class="gallows-rope"></span>
          </div>
        </div>

        <div class="game-panel">
          <div class="panel-header">
            <p class="panel-title">Loesungswort</p>
            <p class="error-counter">Fehler: {{ errorCount }}</p>
          </div>

          <p class="word-preview">{{ displayWord }}</p>

          <form class="input-section" @submit.prevent="guessLetter">
            <input
              type="text"
              v-model="inputLetter"
              class="letter-input"
              placeholder="A"
              maxlength="1"
              aria-label="Buchstaben eingeben"
            />
          </form>

          <p v-if="feedback" :class="['feedback', 'feedback-' + feedbackType]">
            {{ feedback }}
          </p>

          <button class="pixel-button" type="button" @click="selectRandomWord">
            Neues Wort
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="words.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
