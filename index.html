<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Hangman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main class="game-shell">
      <p class="game-label">Vue.js Projekt</p>
      <h1 class="game-title">Retro Hangman</h1>
      <p class="game-subtitle">{{ message }}</p>

      <section class="game-panel">
        <p class="panel-title">Spielfeld</p>
        <p class="word-preview">{{ displayWord }}</p>
        
        <div class="input-section">
          <input 
            type="text" 
            v-model="inputLetter"
            @keypress="handleKeyPress"
            class="letter-input"
            placeholder="Buchstabe"
            maxlength="1"
          />
          <button class="pixel-button" type="button" @click="guessLetter">
            Prüfen
          </button>
        </div>

        <p v-if="feedback" :class="['feedback', 'feedback-' + feedbackType]">
          {{ feedback }}
        </p>
        
        <button class="pixel-button" type="button" @click="selectRandomWord" style="margin-top: 16px;">
          Neues Wort
        </button>
      </section>

      <p class="hint-text">
        Erratene Buchstaben: {{ guessedLetters.join(", ") || "keine" }}
      </p>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="words.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
